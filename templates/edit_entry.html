{% extends "base.html" %}

{% block content %}
<div class="content-grid" style="grid-template-columns: 1fr;">
    <div class="panel">
        <div class="panel-header">
            <h2>Eintrag bearbeiten</h2>
        </div>
        
        <form class="entry-form" method="POST" action="{{ url_for('edit_entry', entry_id=entry.id) }}">
            <div class="form-row two-col">
                <label>
                    <span>Datum</span>
                    <input type="date" name="entry_date" value="{{ entry.entry_date.strftime('%Y-%m-%d') if entry.entry_date else '' }}" required>
                </label>
                <div class="rating-field">
                    <span>Bewertung</span>
                    <div class="rating-picker">
                        {% for i in range(1, 6) %}
                        <input type="radio" id="rating-{{ i }}" name="rating" value="{{ i }}" {% if entry.rating == i %}checked{% endif %}>
                        <label for="rating-{{ i }}">{{ i }}</label>
                        {% endfor %}
                    </div>
                </div>
            </div>
            
            <label>
                <span>High Light</span>
                <textarea name="high_light">{{ entry.high_light }}</textarea>
            </label>
            <label>
                <span>Low Light</span>
                <textarea name="low_light">{{ entry.low_light }}</textarea>
            </label>
            <label>
                <span>Notizen</span>
                <textarea name="notes">{{ entry.notes or '-' }}</textarea>
            </label>
            
            <div class="form-actions">
                <button type="submit" class="primary-btn" style="width: auto;">Aktualisieren</button>
                <a href="{{ url_for('index') }}" class="cancel-link">Abbrechen</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
