{% extends "base.html" %}

{% block auth_content %}
<div class="auth-brand">
    <div class="auth-logo auth-logo-warning">!</div>
    <p class="auth-eyebrow">Sicherheit</p>
    <h1 class="auth-title">Passwort ändern</h1>
    <p class="auth-subtitle">Bitte ändere dein Standard-Passwort.</p>
</div>

<div class="auth-hint auth-hint-warning">
    <strong>Achtung:</strong> Du musst dein Passwort ändern, bevor du das Tagebuch nutzen kannst.
</div>

<form class="auth-form" method="POST" action="{{ url_for('change_password') }}">
    <label class="auth-field">
        <span>Aktuelles Passwort</span>
        <input type="password" name="current_password" required autofocus>
    </label>
    <label class="auth-field">
        <span>Neues Passwort (mind. 4 Zeichen)</span>
        <input type="password" name="new_password" required>
    </label>
    <label class="auth-field">
        <span>Neues Passwort bestätigen</span>
        <input type="password" name="confirm_password" required>
    </label>
    <button type="submit" class="primary-btn">Passwort speichern</button>
</form>
{% endblock %}
