{% extends "base.html" %}

{% block content %}
<div class="content-grid" style="grid-template-columns: 1fr;">
    <div class="panel">
        <div class="panel-header">
            <h2>Neuen Tagebucheintrag erstellen</h2>
        </div>
        
        <form class="entry-form" method="POST" action="{{ url_for('create_entry') }}">
            <div class="form-row two-col">
                <label>
                    <span>Datum</span>
                    <input type="date" name="entry_date" required>
                </label>
                <div class="rating-field">
                    <span>Bewertung</span>
                    <div class="rating-picker">
                        {% for i in range(1, 6) %}
                        <input type="radio" id="rating-{{ i }}" name="rating" value="{{ i }}" {% if i == 3 %}checked{% endif %}>
                        <label for="rating-{{ i }}">{{ i }}</label>
                        {% endfor %}
                    </div>
                </div>
            </div>
            
            <label>
                <span>High Light</span>
                <textarea name="high_light"></textarea>
            </label>
            <label>
                <span>Low Light</span>
                <textarea name="low_light"></textarea>
            </label>
            <label>
                <span>Notizen</span>
                <textarea name="notes"></textarea>
            </label>
            
            <div class="form-actions">
                <button type="submit" class="primary-btn" style="width: auto;">Speichern</button>
                <a href="{{ url_for('index') }}" class="cancel-link">Abbrechen</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
