{% extends "base.html" %}

{% block auth_content %}
<div class="auth-brand">
    <div class="auth-logo">M</div>
    <p class="auth-eyebrow">MINT Ferienwoche</p>
    <h1 class="auth-title">Tagebuch Login</h1>
    <p class="auth-subtitle">Melde dich an, um deine Einträge zu sehen.</p>
</div>

<form class="auth-form" method="POST" action="{{ url_for('login') }}">
    <label class="auth-field">
        <span>Name</span>
        <input type="text" name="name" value="{{ name }}" required autofocus>
    </label>
    <label class="auth-field">
        <span>Passwort</span>
        <input type="password" name="password" required>
    </label>
    <button type="submit" class="primary-btn">Anmelden</button>
</form>

<div class="auth-hint">
    <strong>Hinweis:</strong> Das Standard-Passwort ist <code>1234</code> und muss beim ersten Login geändert werden.
</div>
{% endblock %}
