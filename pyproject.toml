[project]
name = "mint-tagebuch"
version = "0.2.0"
description = "Mint Week Tagebuch mit Login, Rollen (Admin/Editor/Viewer) und Nutzerverwaltung"
readme = "README.md"
authors = [
    { name = "Printer999", email = "nils.rink.ul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "quart>=0.21.0",
    "psycopg[binary]>=3.2.1",
    "bcrypt>=4.2.0",
    "hypercorn>=0.17.0",
]

[project.scripts]
mint-tagebuch = "mint_tagebuch:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"