[project]
name = "mint-tagebuch"
version = "0.2.0"
description = "Mint Week Tagebuch mit Login, Rollen (Admin/Editor/Viewer) und Nutzerverwaltung"
readme = "README.md"
authors = [
    { name = "Printer999", email = "nils.rink.ul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "quart>=0.21.0",
    "psycopg[binary]>=3.2.1",
    "bcrypt>=4.2.0",
    "hypercorn>=0.17.0",
]

[tool.uv]
# This is a Quart application started via Procfile, not an installable Python
# package.  Therefore uv must only install its dependencies during deployment.
package = false
