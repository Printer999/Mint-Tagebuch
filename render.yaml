# Render Blueprint für das Mint Week Tagebuch
# https://render.com/docs/blueprint-spec
#
# Dieser Blueprint legt den Python-Web-Service an.
# Die Zugangsdaten eines erreichbaren MySQL-Servers beim Deployment eintragen.

services:
  - type: web
    name: mint-tagebuch
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: hypercorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true  # ein langer, zufälliger Wert für signierte Sessions
      - key: TRUST_PROXY_HEADERS
        value: "true"  # Render liefert die Client-IP über X-Forwarded-For
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
